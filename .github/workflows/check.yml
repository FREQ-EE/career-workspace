name: Verify and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test
      - run: npm run audit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: npm run test:runtime
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run build:sites
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: contributor-packages
          path: releases/*
          retention-days: 7
  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:runtime
      - run: npm run package:desktop -- --${{ matrix.arch }}
      - run: node scripts/smoke-desktop.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.blockmap
            artifacts/*.png
            artifacts/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
