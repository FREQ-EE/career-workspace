name: One-time obsolete Actions artifact cleanup
on:
  push:
    paths: ['.github/workflows/one-time-artifact-cleanup.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete only obsolete Career Workspace build packages
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | [.id,.name,.size_in_bytes] | @tsv' > /tmp/obsolete-artifacts.tsv
          count=0; bytes=0
          while IFS=$'\t' read -r id name size; do
            [[ -n "${id:-}" ]] || continue
            if [[ "$name" =~ ^(desktop-(windows-latest-x64|macos-15-(arm64|intel-x64))|contributor-packages)$ ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" --silent
              echo "Deleted $name, id=$id, bytes=$size"
              count=$((count + 1))
              bytes=$((bytes + size))
            fi
          done < /tmp/obsolete-artifacts.tsv
          echo "Cleanup complete: ${count} obsolete artifacts; ${bytes} bytes removed. Published Releases remain untouched."
